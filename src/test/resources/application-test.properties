# Test Profile Configuration
spring.application.name=Dashboard-Test

# Database - H2 for unit tests (no TestContainers)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# The Flyway migrations are PostgreSQL SQL (partial indexes, named FK changes) and don't run on
# H2; Hibernate builds the H2 schema from the entities instead. Migrations are exercised against
# real PostgreSQL (docker compose / Testcontainers).
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Redis - Embedded or skip
spring.redis.host=localhost
spring.redis.port=6379

# Kafka - TestContainers will manage this
spring.kafka.bootstrap-servers=localhost:29092

# Security
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.linkedin.client-id=test-linkedin-id
spring.security.oauth2.client.registration.linkedin.client-secret=test-linkedin-secret

# AI Configuration (optional for tests)
spring.ai.anthropic.api-key=test-api-key

# Logging
logging.level.root=WARN
logging.level.com.VentureCapitals.Dashboard=DEBUG
